name: Android diagnostic APK

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android 35 build platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Assemble debug APK
        id: assemble
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --console=plain :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle-assemble.log"

      - name: Report Gradle failure context
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          log = Path(os.environ["RUNNER_TEMP"]) / "gradle-assemble.log"
          if not log.exists():
              raise SystemExit(0)
          lines = log.read_text(errors="replace").splitlines()
          diagnostics = [
              i for i, line in enumerate(lines)
              if re.match(r"\s*[ew]:\s", line)
              or re.search(r"\bFAILED\b|What went wrong:|Execution failed for task|Compilation error|^FAILURE:", line)
          ]
          if diagnostics:
              selected = []
              for i in diagnostics:
                  selected.extend(lines[max(0, i - 1):min(len(lines), i + 5)])
              message = "\n".join(dict.fromkeys(selected))[-4500:]
          else:
              message = "\n".join(lines[-50:])[-4500:]
          escaped = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Gradle assemble failed::{escaped}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Gradle assemble failure context\n\n```text\n")
              summary.write(message)
              summary.write("\n```\n")
          PY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: whiteboard-studio-diagnostic-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
